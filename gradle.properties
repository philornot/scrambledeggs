# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.17.17
fabric_kotlin_version=1.13.13+kotlin.2.4.10

# Mod Properties
mod_version=1.0.0
maven_group=com.philornot.scrambledeggs

# Dependencies
fabric_api_version=0.153.0+26.1.2

# Range used for the "minecraft" entry in fabric.mod.json's depends block.
# Overridden per-build (via -Pminecraft_dependency_version=...) when building
# release jars for other Minecraft versions (see .github/workflows/release.yml).
minecraft_dependency_version=~26.1
